# Save this as .github/workflows/snake.yml in your sohankanna/sohankanna profile repo.
# It regenerates the contribution-snake SVG every 12 hours and pushes it to the `output` branch.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sohankanna
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00FF41&color_dots=#0D1117,#003B00,#008F11,#00C425,#00FF41

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
