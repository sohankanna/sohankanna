<svg xmlns="http://www.w3.org/2000/svg" width="860" height="236" viewBox="0 0 860 236" role="img" aria-label="Sohan Kanna: malware analyst, threat hunter, security researcher" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Sohan Kanna</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .p { fill: #8b949e; font-size: 15px; }
    .c { fill: #c9d1d9; font-size: 15px; }
    .g { fill: #00ff41; }
    .name { fill: #00ff41; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
    .dim { fill: #8b949e; font-size: 14px; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .type { clip-path: inset(0 100% 0 0); animation: type 0.9s steps(28, end) forwards; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .type { animation: none; opacity: 1; clip-path: none; }
      .cur { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="235" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="858" height="30" rx="10" fill="url(#bar)"/>
  <rect x="1" y="21" width="858" height="10" fill="#161b22"/>
  <circle cx="22" cy="16" r="5.5" fill="#ff5f56"/>
  <circle cx="41" cy="16" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="5.5" fill="#27c93f"/>
  <text x="430" y="20" text-anchor="middle" class="mono dim">sohankanna@diamond-dogs: ~</text>

  <g class="mono">
    <g class="line" style="animation-delay:0.2s">
      <text x="24" y="62" class="p">$ <tspan class="c type" style="animation-delay:0.3s">whoami</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.3s">
      <text x="24" y="104" class="name">SOHAN KANNA</text>
    </g>
    <g class="line" style="animation-delay:1.8s">
      <text x="24" y="134" class="c">malware analyst <tspan class="g">//</tspan> reverse engineer <tspan class="g">//</tspan> SOC operator <tspan class="g">//</tspan> threat hunter</text>
    </g>
    <g class="line" style="animation-delay:2.5s">
      <text x="24" y="170" class="p">$ <tspan class="c type" style="animation-delay:2.6s">cat ./motto</tspan></text>
    </g>
    <g class="line" style="animation-delay:3.7s">
      <text x="24" y="196" class="g" font-size="15">I break it to learn how it was built.</text>
    </g>
    <g class="line" style="animation-delay:4.2s">
      <text x="24" y="222" class="p">$ <tspan class="g cur">█</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
