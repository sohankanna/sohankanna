<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Sohan Kanna. Malware analyst, reverse engineer, SOC operator, threat hunter. Now AI Builder Intern at Razorpay, heading to security engineering." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Sohan Kanna</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .p { fill: #8b949e; }
    .c { fill: #c9d1d9; }
    .g { fill: #00ff41; }
    .k { fill: #3fb950; }
    .name { fill: #00ff41; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
    .dim { fill: #8b949e; font-size: 14px; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .type { clip-path: inset(0 100% 0 0); animation: type 0.8s steps(20, end) forwards; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .type { animation: none; opacity: 1; clip-path: none; }
      .cur { animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="859" height="399" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 31 V11 a10 10 0 0 1 10 -10 H849 a10 10 0 0 1 10 10 V31 Z" fill="#161b22"/>
  <circle cx="22" cy="16" r="5.5" fill="#ff5f56"/>
  <circle cx="41" cy="16" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="5.5" fill="#27c93f"/>
  <text x="430" y="20" text-anchor="middle" class="mono dim">sohankanna@diamond-dogs: ~</text>

  <g class="mono">
    <g class="line" style="animation-delay:0.2s"><text x="24" y="62" class="p">$ <tspan class="c type" style="animation-delay:0.3s">whoami</tspan></text></g>
    <g class="line" style="animation-delay:1.2s"><text x="24" y="104" class="name">SOHAN KANNA</text></g>
    <g class="line" style="animation-delay:1.5s"><text x="24" y="134" class="c">malware analyst <tspan class="g">//</tspan> reverse engineer <tspan class="g">//</tspan> SOC operator <tspan class="g">//</tspan> threat hunter</text></g>

    <g class="line" style="animation-delay:2.1s"><text x="24" y="172" class="p">$ <tspan class="c type" style="animation-delay:2.2s">cat ~/.profile</tspan></text></g>
    <g class="line" style="animation-delay:3.1s"><text x="24" y="198"><tspan class="k">now</tspan><tspan x="148" class="c">AI Builder Intern @ Razorpay, Bengaluru</tspan></text></g>
    <g class="line" style="animation-delay:3.2s"><text x="24" y="222"><tspan class="k">heading_to</tspan><tspan x="148" class="c">security engineering</tspan></text></g>
    <g class="line" style="animation-delay:3.3s"><text x="24" y="246"><tspan class="k">focus</tspan><tspan x="148" class="c">malware analysis, reverse engineering, detection engineering, AppSec</tspan></text></g>
    <g class="line" style="animation-delay:3.4s"><text x="24" y="270"><tspan class="k">ctf_team</tspan><tspan x="148" class="c">Diamond_Dogs</tspan></text></g>
    <g class="line" style="animation-delay:3.5s"><text x="24" y="294"><tspan class="k">ask_me</tspan><tspan x="148" class="c">Ghidra, malware triage, SIEM pipelines, AI vuln-hunting agents, CTFs</tspan></text></g>

    <g class="line" style="animation-delay:4.0s"><text x="24" y="332" class="p">$ <tspan class="c type" style="animation-delay:4.1s">cat ./motto</tspan></text></g>
    <g class="line" style="animation-delay:5.0s"><text x="24" y="358" class="g">I break it to learn how it was built.</text></g>
    <g class="line" style="animation-delay:5.4s"><text x="24" y="384" class="p">$ <tspan class="g cur">█</tspan></text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
